name: BMA feature delivery
on:
  issues:
    types: [labeled]
permissions:
  contents: read
  id-token: write
concurrency:
  group: bma-feature-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  feature:
    if: github.event.label.name == 'agent-feature' && contains(github.event.issue.labels.*.name, 'agent-feature') && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      BMA_MODEL: ${{ vars.BMA_MODEL }}
      BMA_ARTIFACT_BUCKET: ${{ vars.BMA_ARTIFACT_BUCKET }}
      BMA_EVIDENCE_BUCKET: ${{ vars.BMA_EVIDENCE_BUCKET }}
      BMA_RUNTIME_ARN: ${{ vars.BMA_RUNTIME_ARN }}
      BMA_SESSION_ROLE_ARN: ${{ vars.BMA_SESSION_ROLE_ARN }}
      BMA_BROWSER_ID: ${{ vars.BMA_BROWSER_ID }}
      BMA_PREVIEW_ORIGIN: ${{ vars.APP_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Pin the trusted source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Authorize and snapshot the PRD
        id: assignment
        env:
          DEMO_OPERATORS: ${{ vars.DEMO_OPERATORS }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
        run: node scripts/prepare-feature.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.assignment.outputs.prepared == 'true'
        with:
          python-version: '3.12'
      - if: steps.assignment.outputs.prepared == 'true'
        run: |
          pip install -r pipeline/requirements.txt
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        if: steps.assignment.outputs.prepared == 'true'
        with:
          role-to-assume: ${{ vars.AWS_REPAIR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: BMA plan and visual design proposal
        id: plan
        if: steps.assignment.outputs.prepared == 'true'
        env:
          DEMO_OPERATORS: ${{ vars.DEMO_OPERATORS }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BMA_MODEL: ${{ vars.BMA_MODEL }}
          BMA_ARTIFACT_BUCKET: ${{ vars.BMA_ARTIFACT_BUCKET }}
          BMA_EVIDENCE_BUCKET: ${{ vars.BMA_EVIDENCE_BUCKET }}
          BMA_RUNTIME_ARN: ${{ vars.BMA_RUNTIME_ARN }}
          BMA_SESSION_ROLE_ARN: ${{ vars.BMA_SESSION_ROLE_ARN }}
          BMA_PREVIEW_ORIGIN: ${{ vars.APP_URL }}
          ASSIGNMENT_PATH: ${{ steps.assignment.outputs.artifact_path }}
          EVENT_ID: ${{ steps.assignment.outputs.event_id }}
          BASE_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          python pipeline/plan_feature.py --prd "$ASSIGNMENT_PATH/prd.md" \
            --base "$BASE_COMMIT" --event "$EVENT_ID" --publish
      - name: Summarize the pinned design proposal
        if: steps.plan.outputs.ready == 'true' || steps.plan.outputs.status == 'questions' || steps.plan.outputs.status == 'restored'
        env:
          ASSIGNMENT_PATH: ${{ steps.assignment.outputs.artifact_path }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          folder = Path(os.environ["ASSIGNMENT_PATH"])
          result = json.loads((folder / "planning-state.json").read_text())
          plan = json.loads((folder / "design" / "plan.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("## BMA visual planning\n\n")
              output.write(f"[Open the design proposal]({result['designUrl']})\n\n")
              output.write(f"Status: **{result['status']}**. Source: `{result['baseCommit']}`.\n\n")
              output.write(f"{len(plan['requirements'])} PRD criteria and {len(plan['screens'])} proposed screens.\n\n")
              output.write("The design is a generated proposal. It is not a deployed feature or a manual approval gate.\n\n")
              if plan["questions"]:
                  output.write("Implementation stopped for these material questions:\n\n")
                  for question in plan["questions"]:
                      output.write(f"- {question}\n")
              else:
                  output.write("Next: independent acceptance authoring, then implementation and review.\n")
          PY
      - name: Independently author and freeze acceptance tests
        if: steps.plan.outputs.ready == 'true'
        env:
          ASSIGNMENT_PATH: ${{ steps.assignment.outputs.artifact_path }}
          EVENT_ID: ${{ steps.assignment.outputs.event_id }}
        run: |
          python pipeline/prepare_feature_acceptance.py \
            --planning "$ASSIGNMENT_PATH/design" --event "$EVENT_ID"
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads((Path(os.environ["ASSIGNMENT_PATH"]) / "acceptance" / "manifest.json").read_text())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as output:
              output.write("\n## Frozen acceptance\n\n")
              output.write(f"{len(manifest['cases'])} independently authored cases. Not yet executed.\n\n")
              output.write(f"Spec SHA-256: `{manifest['acceptanceSha256']}`.\n\n")
              output.write("The implementer cannot edit this suite. All frozen cases must pass.\n")
          PY
      - name: Implement, test, review, and correct within the bounded cycle
        if: steps.plan.outputs.ready == 'true'
        env:
          ASSIGNMENT_PATH: ${{ steps.assignment.outputs.artifact_path }}
          EVENT_ID: ${{ steps.assignment.outputs.event_id }}
        run: |
          python pipeline/feature_cycle.py \
            --planning "$ASSIGNMENT_PATH/design" --event "$EVENT_ID"
      - name: Record independent browser verification and publish evidence
        if: steps.plan.outputs.ready == 'true'
        env:
          ASSIGNMENT_PATH: ${{ steps.assignment.outputs.artifact_path }}
          EVENT_ID: ${{ steps.assignment.outputs.event_id }}
        run: |
          python pipeline/feature_browser.py --event "$EVENT_ID" \
            --candidate "$ASSIGNMENT_PATH/candidate.json" \
            --planning "$ASSIGNMENT_PATH/design" \
            --acceptance "$ASSIGNMENT_PATH/acceptance"
      - name: Validate the complete publication before GitHub authentication
        id: publication
        if: steps.plan.outputs.ready == 'true'
        env:
          ASSIGNMENT_PATH: ${{ steps.assignment.outputs.artifact_path }}
          DEMO_OPERATORS: ${{ vars.DEMO_OPERATORS }}
        run: |
          python pipeline/publish_feature_pr.py --validate-only \
            --assignment "$ASSIGNMENT_PATH/assignment.json" \
            --event "$GITHUB_EVENT_PATH" --candidate "$ASSIGNMENT_PATH/candidate.json" \
            --planning "$ASSIGNMENT_PATH/design" --acceptance "$ASSIGNMENT_PATH/acceptance" \
            --browser "$ASSIGNMENT_PATH/browser/result.json" \
            --result "$ASSIGNMENT_PATH/publication.json"
          echo "validated=true" >> "$GITHUB_OUTPUT"
      - name: Authenticate the GitHub App for the verified feature
        id: app
        if: steps.publication.outputs.validated == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: bma-playground
          permission-contents: write
          permission-pull-requests: write
      - name: Publish the feature PR and request required-check auto-merge
        if: steps.publication.outputs.validated == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ASSIGNMENT_PATH: ${{ steps.assignment.outputs.artifact_path }}
          DEMO_OPERATORS: ${{ vars.DEMO_OPERATORS }}
        run: |
          python pipeline/publish_feature_pr.py --feature-check "Repair acceptance" \
            --assignment "$ASSIGNMENT_PATH/assignment.json" \
            --event "$GITHUB_EVENT_PATH" --candidate "$ASSIGNMENT_PATH/candidate.json" \
            --planning "$ASSIGNMENT_PATH/design" --acceptance "$ASSIGNMENT_PATH/acceptance" \
            --browser "$ASSIGNMENT_PATH/browser/result.json" \
            --result "$ASSIGNMENT_PATH/publication.json"
      - uses: actions/upload-artifact@v4
        if: always() && steps.assignment.outputs.prepared == 'true'
        with:
          name: feature-delivery-${{ steps.assignment.outputs.event_id }}
          path: ${{ steps.assignment.outputs.artifact_path }}
          retention-days: 14
