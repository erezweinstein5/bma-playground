name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pipeline:
    name: Pipeline safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: pip install -r pipeline/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
  scope:
    name: Repair scope
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate application-only changes using the base revision
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          python pipeline/check_scope.py
  baseline:
    name: Build, unit, and board checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: baseline-browser-results
          path: |
            test-results/
            playwright-report/
  repair:
    name: Repair acceptance
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Load independent acceptance test from the PR base revision
        # The proposed repair cannot approve itself by weakening this check.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          mkdir -p tests/browser
          git show "$BASE_SHA:tests/browser/repair.spec.js" > tests/browser/repair.spec.js
          git show "$BASE_SHA:playwright.config.js" > playwright.config.js
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/repair.spec.js
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: contains(github.event.pull_request.head.ref, '-issue-feature-')
        with:
          python-version: '3.12'
      - name: Validate the exact feature revision against the frozen acceptance bundle
        if: contains(github.event.pull_request.head.ref, '-issue-feature-')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BMA_PREVIEW_ORIGIN: ${{ vars.APP_URL }}
        run: |
          set -euo pipefail
          BMA_TRUSTED_PIPELINE="$(mktemp -d)"
          git archive "$BASE_SHA" pipeline | tar -x -C "$BMA_TRUSTED_PIPELINE"
          pip install -r "$BMA_TRUSTED_PIPELINE/pipeline/requirements.txt"
          python "$BMA_TRUSTED_PIPELINE/pipeline/feature_delivery.py" ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: repair-browser-results
          path: |
            test-results/
            playwright-report/
            artifacts/feature-delivery-ci/
