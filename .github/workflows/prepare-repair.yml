name: BMA repair
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
permissions:
  contents: read
  id-token: write
concurrency:
  group: bma-repair-main
  cancel-in-progress: false
jobs:
  repair:
    if: contains(github.event.issue.labels.*.name, 'agent-fix') && !github.event.issue.pull_request
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Pin source revision
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Authorize and normalize the assignment
        id: assignment
        env:
          DEMO_OPERATORS: ${{ vars.DEMO_OPERATORS }}
          SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          BMA_MODEL: ${{ vars.BMA_MODEL }}
          BMA_RUNTIME_ARN: ${{ vars.BMA_RUNTIME_ARN }}
          BMA_SESSION_ROLE_ARN: ${{ vars.BMA_SESSION_ROLE_ARN }}
          BMA_WORKSPACE: /mnt/home/workspace
        run: node scripts/prepare-repair.mjs
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        if: steps.assignment.outputs.prepared == 'true'
        with:
          python-version: '3.12'
      - if: steps.assignment.outputs.prepared == 'true'
        run: pip install -r pipeline/requirements.txt
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        if: steps.assignment.outputs.prepared == 'true'
        with:
          role-to-assume: ${{ vars.AWS_REPAIR_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Run Codex through BMA and validate the application patch
        id: repair
        if: steps.assignment.outputs.prepared == 'true'
        env:
          BMA_ARTIFACT_BUCKET: ${{ vars.BMA_ARTIFACT_BUCKET }}
          BMA_MODEL: ${{ vars.BMA_MODEL }}
          BMA_RUNTIME_ARN: ${{ vars.BMA_RUNTIME_ARN }}
          BMA_SESSION_ROLE_ARN: ${{ vars.BMA_SESSION_ROLE_ARN }}
          ASSIGNMENT_PATH: ${{ steps.assignment.outputs.artifact_path }}
        run: python pipeline/repair.py "$ASSIGNMENT_PATH/assignment.json"
      - name: Authenticate the GitHub App after patch validation
        id: app
        if: steps.repair.outputs.validated == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: bma-playground
          permission-contents: write
          permission-pull-requests: write
      - name: Publish PR and enable required-check auto-merge
        if: steps.repair.outputs.validated == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ASSIGNMENT_PATH: ${{ steps.assignment.outputs.artifact_path }}
        run: python pipeline/publish_pr.py "$ASSIGNMENT_PATH/result.json"
      - uses: actions/upload-artifact@v4
        if: always() && steps.assignment.outputs.prepared == 'true'
        with:
          name: repair-${{ steps.assignment.outputs.event_id }}
          path: ${{ steps.assignment.outputs.artifact_path }}
          retention-days: 7
